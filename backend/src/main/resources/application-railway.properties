# Railway Cloud Production Profile
# Activated when SPRING_PROFILES_ACTIVE=railway
spring.datasource.url=${DB_URL:jdbc:mysql://mysql.railway.internal:3306/railway}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.bootstrap-admin.email=${ADMIN_EMAIL:admin@neuroforge.local}
app.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@1234}
