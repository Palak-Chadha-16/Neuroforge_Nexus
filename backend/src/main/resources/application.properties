server.port=${PORT:${SERVER_PORT:8080}}

# Database configuration: defaults to persistent local H2 file database,
# but seamlessly switches to MySQL if DB_URL is supplied via environment variables
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/neuroforge;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT Authentication
app.jwt.secret=${JWT_SECRET:neuroforge-enterprise-jwt-token-secret-key-at-least-256-bits-long-32-bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Bootstrap Administrator
app.bootstrap-admin.name=${ADMIN_FULL_NAME:System Admin}
app.bootstrap-admin.full-name=${ADMIN_FULL_NAME:System Admin}
app.bootstrap-admin.user-id=${ADMIN_USER_ID:admin}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@neuroforge.io}
app.bootstrap-admin.contact-number=${ADMIN_CONTACT:0000000000}
app.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@123}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# --- AI Chatbot (Groq) ---
neuroforge.chat.api-key=${GROQ_API_KEY:}
neuroforge.chat.base-url=https://api.groq.com/openai/v1
neuroforge.chat.model=openai/gpt-oss-120b

# --- GitHub API ---
github.token=${GITHUB_TOKEN:}